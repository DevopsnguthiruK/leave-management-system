<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Holidays</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Navigation (similar to dashboard) -->
    <nav class="bg-yellow-600 shadow-sm px-6 py-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white">Manage Holidays</h1>
            <a href="{{ url_for('admin.dashboard') }}" class="text-white hover:underline">
                <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
            </a>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <!-- Add Holiday Button -->
        <div class="mb-6">
            <button id="addHolidayBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">
                <i class="fas fa-plus mr-2"></i>Add New Holiday
            </button>
        </div>

        <!-- Holidays Table -->
        <div class="bg-white shadow rounded-lg">
            <table class="w-full">
                <thead class="bg-gray-100 border-b">
                    <tr>
                        <th class="p-3 text-left">Name</th>
                        <th class="p-3 text-left">Date</th>
                        <th class="p-3 text-left">Description</th>
                        <th class="p-3 text-left">Recurring</th>
                        <th class="p-3 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for holiday in holidays %}
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3">{{ holiday.name }}</td>
                        <td class="p-3">{{ holiday.date.strftime('%Y-%m-%d') }}</td>
                        <td class="p-3">{{ holiday.description or 'N/A' }}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded-full text-xs {{ 'bg-green-100 text-green-800' if holiday.is_recurring else 'bg-gray-100 text-gray-800' }}">
                                {{ 'Yes' if holiday.is_recurring else 'No' }}
                            </span>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="deleteHoliday({{ holiday.id }})" class="text-red-600 hover:text-red-800">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Holiday Modal -->
    <div id="addHolidayModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-96">
            <h2 class="text-xl font-bold mb-4">Add New Holiday</h2>
            <form id="addHolidayForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Holiday Name</label>
                    <input type="text" id="holidayName" class="w-full px-3 py-2 border rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Date</label>
                    <input type="date" id="holidayDate" class="w-full px-3 py-2 border rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Description (Optional)</label>
                    <textarea id="holidayDescription" class="w-full px-3 py-2 border rounded-lg"></textarea>
                </div>
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="isRecurring" class="mr-2">
                        <span>Recurring Holiday</span>
                    </label>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg">Save Holiday</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Modal Functionality
        const addHolidayBtn = document.getElementById('addHolidayBtn');
        const addHolidayModal = document.getElementById('addHolidayModal');

        addHolidayBtn.addEventListener('click', () => {
            addHolidayModal.classList.remove('hidden');
        });

        function closeModal() {
            addHolidayModal.classList.add('hidden');
            // Reset form
            document.getElementById('addHolidayForm').reset();
        }

        // Form Submission
        document.getElementById('addHolidayForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const holidayData = {
                name: document.getElementById('holidayName').value,
                date: document.getElementById('holidayDate').value,
                description: document.getElementById('holidayDescription').value,
                is_recurring: document.getElementById('isRecurring').checked
            };

            try {
                const response = await fetch("{{ url_for('admin.create_holiday') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    },
                    body: JSON.stringify(holidayData)
                });

                const result = await response.json();

                if (response.ok) {
                    // Refresh page to show new holiday
                    window.location.reload();
                } else {
                    alert(result.message || 'Failed to create holiday');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred');
            }
        });

        // Delete Holiday
        function deleteHoliday(holidayId) {
            if (!confirm('Are you sure you want to delete this holiday?')) return;

            fetch(`/admin/holidays/${holidayId}/delete`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                }
            })
            .then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    return response.json().then(err => { throw err; });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert(error.message || 'Failed to delete holiday');
            });
        }
    </script>
</body>
</html>
