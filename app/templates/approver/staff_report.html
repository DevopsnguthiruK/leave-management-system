<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <nav class="bg-blue-600 shadow-sm px-6 py-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white">Staff Report</h1>
            <a href="{{ url_for('approver.dashboard') }}" class="text-white hover:text-gray-200">
                <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
            </a>
        </div>
    </nav>

    <div class="p-6">
        <div class="bg-white rounded-lg shadow">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-bold">Department Staff Report</h2>
                <button onclick="exportToPDF()" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fas fa-file-pdf mr-2"></i>Export to PDF
                </button>
            </div>
            <div class="p-6 overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Gender</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Join Date</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        {% for employee in employees %}
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap">{{ employee.name }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ employee.email }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ employee.role }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ employee.gender }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ employee.joined_date }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function exportToPDF() {
            window.location.href = window.location.href + '?format=pdf';
        }
    </script>
</body>
</html>
